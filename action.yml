name: spt-package-action
description:
  A GitHub Action that packages SPT (Single Player Tarkov) mods into
  distributable zip files
author: Suntion

branding:
  icon: package
  color: blue

inputs:
  project-path:
    description: |
      Path(s) to the .csproj file(s), one per line.
      If not specified, the action will auto-detect .csproj files.
      Multiple projects will be packaged separately.
      Example: |
        src/ProjectA/ProjectA.csproj
        src/ProjectB/ProjectB.csproj
    required: false
    default: ''

  exclude-patterns:
    description: |
      Additional directory patterns to exclude from project scanning (one per line).
      Default exclusions: Test, test, node_modules, .venv
      Example: |
        Build
        dist
        temp
    required: false
    default: ''

  max-depth:
    description: Maximum depth to scan for .csproj files
    required: false
    default: '5'

  mod-folder-name:
    description: |
      Custom name for the mod folder in the output structure.
      If not specified, uses the project name.
      Output path: SPT/user/mods/{mod-folder-name}/
    required: false
    default: ''

  resource-paths:
    description: |
      Additional resource directories to include in the package (one per line).
      Default resources: db, data, wwwroot, res
      Example: |
        assets
        config
        plugins
    required: false
    default: ''

  include-source-files:
    description:
      Whether to include source code files (.cs, .ts, etc.) in the package
    required: false
    default: 'false'

outputs:
  artifact-name:
    description: Name of the uploaded artifact

  artifact-path:
    description: Path to the generated zip file

  project-name:
    description: Name of the packaged project

  project-version:
    description: Version of the packaged project

runs:
  using: node24
  main: dist/index.js
